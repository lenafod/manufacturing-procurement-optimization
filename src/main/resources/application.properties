spring.application.name=main


#postgreSQL database configuration
#spring.datasource.url=jdbc:postgresql://localhost:5432/nabavka_db
#spring.datasource.username=postgres
#spring.datasource.password=Lanadelrey789.
spring.datasource.url=jdbc:h2:mem:nabavka_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

#disable spring security
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

#da custom exception poruke (InvalidRequestException, ResourceNotFoundException) stignu do frontenda
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always