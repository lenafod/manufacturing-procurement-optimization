spring.application.name=main


#postgreSQL database configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/nabavka_db
spring.datasource.username=postgres
spring.datasource.password=Lanadelrey789.
spring.datasource.driver-class-name=org.postgresql.Driver

#h2 in-memory konfiguracija (stara, ostavljena za slucaj da zatreba nazad)
#spring.datasource.url=jdbc:h2:mem:nabavka_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
#spring.datasource.driver-class-name=org.h2.Driver
