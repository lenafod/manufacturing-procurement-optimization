#spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
#spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
#semu i seed podatke sada pravi Liquibase (vidi db/changelog), Hibernate samo proverava da se poklapaju
spring.jpa.hibernate.ddl-auto=validate
#spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

#disable spring security
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

#da custom exception poruke (InvalidRequestException, ResourceNotFoundException) stignu do frontenda
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always

#slanje upita dobavljacima - lokalni Mailpit SMTP catcher (localhost:1025), web inbox na localhost:8025
#nista ne izlazi na pravi internet, bezbedno za izmisljene adrese dobavljaca iz seed podataka
spring.mail.host=127.0.0.1
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
procurement.mail.from=nabavka@mpo-app.local